name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update.zip (if present) and commit the real files
        run: |
          if [ -f update.zip ]; then
            rm -rf /tmp/upd && mkdir /tmp/upd && unzip -q update.zip -d /tmp/upd
            SRC=$(find /tmp/upd -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n1)
            echo "Source root: $SRC"
            cp -r "$SRC"/. .
            rm -f update.zip
            # Fix the three Int.coerceAtLeast call sites reported by run 186.
            python3 - <<'PY'
            p = "app/src/main/java/com/lightninglab/Screens.kt"
            with open(p, encoding="utf-8") as f:
                source = f.read()
            broken = "size.width.coerceAtLeast(1f)"
            if source.count(broken) < 3:
                raise SystemExit("Expected three timeline ruler type errors were not found")
            source = source.replace(broken, "size.width.coerceAtLeast(1)", 3)
            with open(p, "w", encoding="utf-8") as f:
                f.write(source)
            PY
            git config user.name "lightninglab-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            # Do not commit the workflow copied from update.zip: the runner token
            # intentionally lacks the special workflows permission.
            git reset -- .github/workflows
            git commit -m "Apply update.zip" || true
            if ! git push; then
              echo "::warning::Could not push extracted update.zip source; preserving the exact build tree as an artifact."
            fi
          fi
          echo "--- Kotlin sources in build ---"
          ls app/src/main/java/com/lightninglab
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Preserve exact source used by this build
        if: always()
        run: |
          mkdir -p /tmp/lightninglab-build-source
          tar --exclude=.git --exclude=app/build --exclude=.gradle -czf /tmp/lightninglab-build-source/source-used-for-build.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightningLab-source-used-for-build
          path: /tmp/lightninglab-build-source/source-used-for-build.tar.gz
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightningLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

name: Build APK
on:
  push:
    paths:
      - 'update.zip'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'tools/cloud_ai/**'
      - 'tools/lightning_ai/**'
      - 'tools/scientific_accuracy/**'
      - 'tools/ci/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply validated source archive on trusted main only
        id: prepare
        run: |
          python3 -m unittest discover -s tools/ci -v
          if [ -f update.zip ]; then
            python3 tools/ci/apply_update.py update.zip .
            rm update.zip
            git config user.name "lightninglab-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "Apply validated update.zip"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: apply
    if: always() && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Validate source archive importer
        run: python3 -m unittest discover -s tools/ci -v
      - name: Run cloud dataset preparation unit tests
        run: python3 -m unittest discover -s tools/cloud_ai/tests -v
      - name: Compile cloud training utilities
        run: python3 -m compileall -q tools/cloud_ai
      - name: Run lightning dataset preparation unit tests
        run: python3 -m unittest discover -s tools/lightning_ai/tests -v
      - name: Compile lightning AI utilities
        run: python3 -m compileall -q tools/lightning_ai
      - name: Run scientific evaluation tests
        run: python3 -m unittest discover -s tools/scientific_accuracy/tests -v
      - name: Compile scientific evaluation utilities
        run: python3 -m compileall -q tools/scientific_accuracy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightningLab-jvm-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
      - name: Preserve exact source used by this build
        if: always()
        run: |
          mkdir -p /tmp/lightninglab-build-source
          git archive --format=tar.gz HEAD -o /tmp/lightninglab-build-source/source-used-for-build.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightningLab-source-used-for-build
          path: /tmp/lightninglab-build-source/source-used-for-build.tar.gz
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightningLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

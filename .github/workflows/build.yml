name: Build APK
on:
  push:
    paths:
      - 'update.zip'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'tools/cloud_ai/**'
      - 'tools/lightning_ai/**'
      - 'tools/scientific_accuracy/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update.zip (if present) and commit the real files
        run: |
          if [ -f update.zip ]; then
            rm -rf /tmp/upd && mkdir /tmp/upd && unzip -q update.zip -d /tmp/upd
            SRC=$(find /tmp/upd -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n1)
            echo "Source root: $SRC"
            cp -r "$SRC"/. .
            rm -f update.zip
            git config user.name "lightninglab-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            # Do not commit the workflow copied from update.zip: the runner token
            # intentionally lacks the special workflows permission.
            git reset -- .github/workflows
            git commit -m "Apply update.zip" || true
            if ! git push; then
              echo "::warning::Could not push extracted update.zip source; preserving the exact build tree as an artifact."
            fi
          fi
          echo "--- Kotlin sources in build ---"
          ls app/src/main/java/com/lightninglab
      - name: Run cloud dataset preparation unit tests
        run: python3 -m unittest discover -s tools/cloud_ai/tests -v
      - name: Compile cloud training utilities
        run: python3 -m compileall -q tools/cloud_ai
      - name: Run lightning dataset preparation unit tests
        run: python3 -m unittest discover -s tools/lightning_ai/tests -v
      - name: Compile lightning AI utilities
        run: python3 -m compileall -q tools/lightning_ai
      - name: Run scientific evaluation tests
        run: python3 -m unittest discover -s tools/scientific_accuracy/tests -v
      - name: Compile scientific evaluation utilities
        run: python3 -m compileall -q tools/scientific_accuracy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightningLab-jvm-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
      - name: Preserve exact source used by this build
        if: always()
        run: |
          mkdir -p /tmp/lightninglab-build-source
          tar --exclude=.git --exclude=app/build --exclude=.gradle -czf /tmp/lightninglab-build-source/source-used-for-build.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightningLab-source-used-for-build
          path: /tmp/lightninglab-build-source/source-used-for-build.tar.gz
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightningLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
